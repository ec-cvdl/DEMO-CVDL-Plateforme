<title>CVDL — Suivi des commandes</title>
<!-- ⚠️ Le numéro après "?v=" doit être incrémenté à CHAQUE déploiement où un CSS ou un script
     change — sans ça, les navigateurs déjà passés une fois sur l'admin peuvent continuer à
     exécuter une version en cache indéfiniment (aucune date d'expiration explicite côté
     serveur ne semble configurée), même après un redéploiement complet. Pensez à vider aussi le
     cache de votre propre navigateur (Ctrl+Maj+R / Cmd+Maj+R) après un déploiement, le temps
     que ce numéro se généralise. -->

<style>
  /* Écran de connexion — devenu une superposition plein écran (.dialog-backdrop), le
     positionnement centré/étroit d'origine ne s'applique plus qu'à la carte elle-même. */
  #connexion .card{ padding:var(--space-6); gap:var(--space-3); }
  .msg{ font-size:13px; border-radius:var(--radius-md); padding:var(--space-2) var(--space-3); }
  .msg-erreur{ background:var(--color-accent-100); color:var(--color-accent-700); }
  /* Reconnexion silencieuse (session déjà ouverte, F5/lien externe) : formulaire masqué, spinner
     seul affiché le temps de la vérification — jamais l'inverse, pour ne pas laisser deviner le
     mot de passe déjà utilisé à qui recharge la page. La classe est posée avant même le rendu du
     <body> (voir le script juste avant), donc sans le moindre flash du formulaire au chargement. */
  #rp-connexion-spinner{ display:none; flex-direction:column; align-items:center; gap:var(--space-3); padding:var(--space-4) 0; }
  /* .rp-spin est pensé pour un fond coloré (pastille d'état) — blanc sur blanc ici sans ces
     couleurs propres à l'écran de connexion. */
  #rp-connexion-spinner .rp-spin{ width:28px; height:28px; border-width:3px; border-color:var(--color-neutral-200); border-top-color:var(--color-accent); }
  html.rp-reconnexion #rp-connexion-formulaire{ display:none; }
  html.rp-reconnexion #rp-connexion-spinner{ display:flex; }
</style>
<script src="pages/admin-tete.js?v=1"></script>

</head>
<body>

<!-- Connexion : recouvre l'appli (visible en dessous) tant que le mot de passe n'est pas
     validé — seules les données sont chargées après coup, la coquille est visible d'emblée. -->
<div id="connexion" class="dialog-backdrop" style="position:fixed;z-index:60">
  <div class="card elev-lg" style="padding:var(--space-6);gap:var(--space-3);width:min(380px,94vw)">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:var(--space-2)">
      <div style="width:36px;height:36px;border-radius:999px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;flex:none;color:#fff">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="M3.3 7 12 12l8.7-5"/></svg>
      </div>
      <h1 style="font-size:20px">CVDL</h1>
    </div>
    <div id="rp-connexion-spinner">
      <span class="rp-spin"></span>
      <p style="opacity:0.65;font-size:14px;margin:0">Reconnexion…</p>
    </div>
    <div id="rp-connexion-formulaire" style="display:flex;flex-direction:column;gap:var(--space-3)">
    <p style="opacity:0.65;font-size:14px;margin:0 0 var(--space-2)">Accès réservé.</p>
    <div id="rp-google" style="display:none;justify-content:center;min-height:44px"></div>
    <div id="rp-google-ou" style="display:none;align-items:center;gap:10px;font-size:12px;opacity:.55"><span style="flex:1;height:1px;background:currentColor;opacity:.3"></span>ou accès de secours<span style="flex:1;height:1px;background:currentColor;opacity:.3"></span></div>
    <input type="password" id="mdp" class="input" placeholder="Mot de passe">
    <button type="button" class="btn btn-primary btn-block" id="btn-connexion">Ouvrir le suivi</button>
    <div id="retour-connexion"></div>
    </div>
  </div>
</div>

<!-- Application -->

      <span class="rp-label" style="font-weight:600;font-size:14px">Notifications</span>

        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 6h10M7 12h12M5 18h8"/><circle cx="17" cy="6" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>
        <span class="rp-label">Pilotage du projet</span>
      </a>
      <button type="button" id="rp-copier-lien-portail" data-copier-lien-portail title="Lien du portail public" style="all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;padding:11px var(--space-3);border-radius:var(--radius-md);cursor:pointer;font-weight:600;font-size:14px;color:rgba(255,255,255,.75)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L12.5 19.5"/></svg>
        <span class="rp-label">Lien du portail public</span>
      </button>
      <button type="button" class="rp-toggle-theme" id="rp-toggle-theme" title="Changer de thème">
        <svg class="rp-toggle-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="rp-toggle-lune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <span class="rp-label" id="rp-toggle-theme-label">Mode sombre</span>
      </button>
      <button type="button" class="rp-toggle-noel" id="rp-toggle-noel" title="Activer le thème de Noël" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 2 7 9h3l-4 6h4l-4 5h12l-4-5h4l-4-6h3z"/><path d="M12 20v2"/></svg>
        <span class="rp-label" id="rp-toggle-noel-label">Thème de Noël</span>
      </button>
      <button type="button" class="rp-toggle-largeur" id="rp-toggle-largeur" title="Contenu en pleine largeur ou en largeur limitée">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
        <span class="rp-label" id="rp-toggle-largeur-label">Pleine largeur</span>
      </button>
      <button type="button" class="rp-toggle-style" id="rp-toggle-style" title="Changer de style (nouveau / ancien)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span class="rp-label" id="rp-toggle-style-label">Ancien style</span>
      </button>
    </div>
  </aside>
  <main class="rp-main" id="rp-main"></main>
</div>
