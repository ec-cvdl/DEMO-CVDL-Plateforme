<!DOCTYPE html>
<html lang="fr">
<head>
<script src="api.js?v=1"></script>
<script src="commun.js?v=1"></script>
<meta charset="utf-8">
<script src="anti-cadre.js?v=1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de mes demandes SAV — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=34">
<style>
/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1040px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
.spinner-precoce{ width:34px; height:34px; animation:tourner-spinner-precoce .8s linear infinite; }
@keyframes tourner-spinner-precoce{ to{ transform:rotate(360deg); } }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner-spinner-precoce .7s linear infinite; margin-right:8px; vertical-align:-2px; }
.liste-tickets-suivi{ display:flex; flex-direction:column; gap:var(--space-6); margin-top:var(--space-4); }
.materiel-ts{ opacity:0.6; }
.symptome-ts{ opacity:0.7; }
.anneau-sav-wrap{ flex:none; width:64px; height:64px; }
.date-resolution-ts{ opacity:0.55; margin-top:var(--space-2); }
.lien-photo-ts{ display:inline-block; margin-top:var(--space-3); }
.notes-resolution-ts{ margin-top:var(--space-3); padding:12px 14px; }
.liens-colissimo-ts{ margin-top:var(--space-3); display:flex; flex-wrap:wrap; gap:var(--space-3); }
.btn-historique-ts{ box-sizing:border-box; margin-top:var(--space-3); cursor:pointer; }
.historique-ts{ margin-top:var(--space-3); display:flex; flex-direction:column; gap:6px; }
.historique-ts-ligne{ opacity:0.7; display:flex; gap:10px; }
.historique-ts-date{ opacity:0.6; flex:none; }
.btn-deconnexion-fixe{ position:fixed; top:var(--space-4); right:var(--space-4); z-index:150; display:flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer; }
@media (max-width: 640px){
main{ padding:var(--space-6) var(--space-4); }
}
.v1-message{ padding:10px 12px; display:flex; flex-direction:column; gap:4px; }
.liste-tickets-suivi, #liste-tickets-suivi{ display:flex; flex-direction:column; gap:14px; }
</style>
<script src="portail-ui.js?v=30" defer></script>
<script src="cvdl-ui.js?v=12" defer></script>
<link rel="stylesheet" href="retours.css?v=2">
<link rel="stylesheet" href="sav-fil.css?v=1">
<script src="sav-fil.js?v=1"></script>
<script src="retours.js?v=2" defer></script>
</head>
<body data-famille="sav">
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>
<button type="button" class="btn-deconnexion-fixe" id="btn-deconnexion-suivi-sav" hidden>
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Déconnexion
</button>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" data-aller="portail-structure.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <!-- Étape : identification -->
  <section id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Quel est votre <em>code structure</em> ?</h1>
      <p style="opacity:0.6;margin:0">Le même code que pour commander ou suivre une commande.</p>
      <div class="field">
        <label for="code-structure" class="sr-only">Code structure</label>
        <input type="text" class="input" id="code-structure" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-voir-tickets">Continuer</button>
    </div>
  </section>

  <!-- Étape : liste des tickets -->
  <section id="etape-liste" hidden>
    <span data-ill="suiviSav" class="pk-titre-ill xl"></span>
    <h1 style="margin-bottom:var(--space-2)" id="titre-structure"></h1>
    <p style="opacity:0.6;margin:0 0 var(--space-4)" id="nb-tickets-texte"></p>
    <div class="liste-tickets-suivi" id="liste-tickets-suivi"></div>
  </section>
</main>

<script src="deja-identifie.js?v=1"></script>
<script src="pages/suivi-sav-structure.js?v=2"></script>
</body>
</html>
