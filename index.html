<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CVDL</title>
<meta name="robots" content="noindex">
<!-- Page d'arrivée : sur le site de démo (dossier « …demo… »), ouvre demo.html ; sinon l'accueil public. -->
<script>
(function(){
  var dossier = location.pathname.split('/')[1] || '';
  var demo = /demo/i.test(dossier) && !/\.html$/i.test(dossier);
  location.replace(demo ? 'demo.html' : 'portail.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=portail.html"></noscript>
</head>
<body></body>
</html>
