<!DOCTYPE html>
<html lang="fr">
<head>
<script src="api.js?v=2"></script>
<script src="commun.js?v=1"></script>
<meta charset="utf-8">
<script src="anti-cadre.js?v=1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi de mes commandes — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=35">
<style>
.ml-liste{ display:grid; gap:8px; margin-top:14px; }
.ml-ligne{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:var(--trait-doux); border-radius:14px; background:#fff; }
.ml-ligne .ill{ width:34px; height:34px; }
.ml-txt{ flex:1; min-width:0; display:flex; flex-direction:column; }
.ml-txt small{ opacity:.7; font-size:12.5px; }
.cs-personnes{ display:flex; flex-wrap:wrap; gap:8px; }
.cs-personne{ display:inline-flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border:var(--trait-doux); border-radius:14px; background:#fff; }
.cs-personne .ill{ width:34px; height:34px; }
.cs-personne-txt{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; font-size:13px; }
.cs-personne-txt small{ opacity:.7; font-size:12px; }
button.cs-doc{ cursor:pointer; font-family:inherit; color:inherit; }

/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1040px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
.spinner-precoce{ width:34px; height:34px; animation:tourner-spinner-precoce .8s linear infinite; }
@keyframes tourner-spinner-precoce{ to{ transform:rotate(360deg); } }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner-spinner-precoce .7s linear infinite; margin-right:8px; vertical-align:-2px; }
.liste-commandes-suivi{ display:flex; flex-direction:column; gap:var(--space-6); margin-top:var(--space-4); }
.carte-commande-suivi{ position:relative; }
.carte-commande-suivi.masquee-focus{ display:none !important; }
#etape-liste.mode-focus .field, #etape-liste.mode-focus #nb-commandes-texte{ display:none; }
.carte-commande-suivi.carte-focus{ z-index:2; }
.btn-toutes-commandes-suivi{ box-sizing:border-box; cursor:pointer; display:flex; justify-content:center; align-items:center; gap:8px; width:100%; margin-top:var(--space-5); padding:14px; }
.btn-toutes-commandes-suivi[hidden]{ display:none; }
.carte-commande-suivi.annulee{ opacity:0.65; }
.carte-commande-suivi{ position:relative; overflow:hidden; }
.icone-copie-passeport-cs{ display:inline-flex; cursor:pointer; padding:3px; margin:-3px; }
.toast-copie-cs{ position:fixed; bottom:24px; left:50%; padding:9px 18px; z-index:600; opacity:0; pointer-events:none; }
.toast-copie-cs.visible{ opacity:1; }
.entete-cs{ display:flex; align-items:flex-start; gap:var(--space-3); flex-wrap:wrap; }
.date-cs{ opacity:0.5; }
.produits-cs{ opacity:0.6; }
.responsable-cs{ opacity:0.55; margin-top:2px; }
.raison-annulation-cs{ margin-top:10px; padding:12px 14px; white-space:pre-line; }
.tlc-suivi{ display:grid; grid-template-columns:repeat(5,1fr); position:relative; }
.tlc-suivi-etape{ display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; }
.tlc-suivi-etape:first-child::before{ display:none; }
.tlc-suivi-point{ width:11px; height:11px; position:relative; z-index:1; }
.tlc-suivi-libelle{ text-align:center; opacity:0.45; position:relative; z-index:1; }
.tlc-suivi-libelle.actuel{ opacity:1; }
.tlc-suivi-libelle.fait{ opacity:1; }
.liens-documents-cs{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:var(--space-3); }
.liens-documents-cs a{ display:inline-flex; align-items:center; gap:5px; }
.libelle-numeros-serie-cs{ opacity:0.55; display:block; margin-bottom:var(--space-2); }
.accordeon-beneficiaires-cs summary{ cursor:pointer; list-style:none; opacity:0.55; display:flex; align-items:center; gap:6px; }
.accordeon-beneficiaires-cs summary::-webkit-details-marker{ display:none; }
.liste-beneficiaires-cs{ margin:var(--space-2) 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
.pilule-date-estimee-cs{ padding:6px 12px; display:inline-flex; align-items:center; gap:6px; align-self:flex-start; }
.pilule-date-livree-cs{ padding:6px 12px; display:inline-flex; align-items:center; gap:6px; align-self:flex-start; }
.pilule-mode-cs{ padding:4px 10px; display:inline-flex; align-items:center; gap:5px; align-self:flex-start; }
.pilule-paiement-cs{ padding:4px 10px; display:inline-flex; align-items:center; gap:5px; align-self:flex-start; }
.fleche-lien-externe{ opacity:0.85; flex:none; }
.pied-cs{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; padding-top:var(--space-3); }
.lien-cs{ display:inline-flex; align-items:center; gap:4px; }
.statut-paiement-cs{ padding:4px 10px; }
.rangee-boutons-paiement-cs{ display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
.lien-paiement-cs{ padding:8px 14px; display:inline-flex; align-items:center; gap:6px; }
.btn-deconnexion-fixe{ position:fixed; top:var(--space-4); right:var(--space-4); z-index:150; display:flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer; }
@media (max-width: 640px){
main{ padding:var(--space-6) var(--space-4); }
}
</style>
<script src="portail-ui.js?v=36" defer></script>
<script src="cvdl-ui.js?v=13" defer></script>
<link rel="stylesheet" href="retours.css?v=2">
<script src="retours.js?v=2" defer></script>
</head>
<body data-famille="commandes">
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>
<button type="button" class="btn-deconnexion-fixe" id="btn-deconnexion-suivi" hidden>
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Déconnexion
</button>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" data-aller="portail-structure.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <!-- Étape : identification -->
  <section id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Quel est votre <em>code structure</em> ?</h1>
      <p style="opacity:0.6;margin:0">Ce code vous a été communiqué par mail — le même que pour commander du matériel ou signaler une panne. Vous voulez plutôt <a href="commande.html">commander du matériel</a> ou <a href="sav.html">signaler une panne</a> ?</p>
      <div class="field">
        <label for="code-structure" class="sr-only">Code structure</label>
        <input type="text" class="input" id="code-structure" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-voir-commandes">Continuer</button>
    </div>
  </section>

  <!-- Étape : liste des commandes -->
  <section id="etape-liste" hidden>
    <span data-ill="commandes" class="pk-titre-ill xl"></span>
    <h1 style="margin-bottom:var(--space-2)" id="titre-structure"></h1>
    <p style="opacity:0.6;margin:0 0 var(--space-4)" id="nb-commandes-texte"></p>
    <div class="cs-barre">
      <div class="field cs-recherche">
        <label for="recherche-suivi" class="sr-only">Rechercher une personne, un numéro de série ou un code</label>
        <input type="text" class="input" id="recherche-suivi" autocomplete="off" spellcheck="false" placeholder="Rechercher par nom, prénom, numéro de série ou code…">
      </div>
      <div class="cs-filtres" role="group" aria-label="Filtrer par état">
        <button type="button" class="cs-filtre actif" data-filtre-suivi="">Toutes</button>
        <button type="button" class="cs-filtre" data-filtre-suivi="attente"><span class="cs-f" data-forme="losange"></span>À traiter</button>
        <button type="button" class="cs-filtre" data-filtre-suivi="cours"><span class="cs-f" data-forme="carre"></span>En cours</button>
        <button type="button" class="cs-filtre" data-filtre-suivi="fini"><span class="cs-f" data-forme="rond"></span>Livrées / annulées</button>
      </div>
    </div>
    <div class="liste-commandes-suivi" id="liste-commandes-suivi"></div>
  </section>
</main>

<script src="deja-identifie.js?v=1"></script>
<link rel="stylesheet" href="notifications-portail.css?v=1">
<script src="notifications-portail.js?v=1"></script>
<script src="pages/suivi.js?v=3"></script>
<div class="voile-modale-qr" id="modale-liens" role="dialog" aria-modal="true" aria-labelledby="modale-liens-titre">
  <div class="modale-qr">
    <h3 id="modale-liens-titre">Liens</h3>
    <p id="modale-liens-intro"></p>
    <div id="modale-liens-liste" class="ml-liste"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button type="button" class="btn btn-secondary" id="modale-liens-fermer">Fermer</button></div>
  </div>
</div>
</body>
</html>
