<!DOCTYPE html>
<html lang="fr">
<head>
<script>
const API = (function(){ var prod = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api'; try{ var dossier = location.pathname.split('/')[1] || ''; if(/demo/i.test(dossier) && !/\.html$/i.test(dossier)) return prod + '-demo'; var d = JSON.parse(localStorage.getItem('cvdl-mode-demo') || 'null'); if(d && d.jusqua > Date.now()) return prod + '-demo'; }catch(e){} return prod; })(); // démo : site publié dans un dossier « …demo… » (ex. /cvdl-demo/), ou repère posé par demo.html → cvdl-api-demo
</script>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets de distribution — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=32">
<link rel="stylesheet" href="assistant-portail.css?v=1">
<style>
/* Mise en page de la page ; composants visuels : cvdl-ui.css (+ quelques blocs propres ci-dessous). */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1120px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner .7s linear infinite; margin-right:8px; vertical-align:-2px; }
@keyframes tourner{ to{ transform:rotate(360deg); } }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; }
#voile-verification-precoce .spinner-precoce{ width:34px; height:34px; animation:tourner .8s linear infinite; }
.btn-deconnexion-fixe{ position:fixed; top:var(--space-4); right:var(--space-4); z-index:150; display:flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer; }
@media (max-width:640px){ main{ padding:var(--space-6) var(--space-4); } }

/* ── Projets (pd-) ── */
.pd-tete{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
.pd-tete p{ opacity:.65; margin:0; max-width:640px; }
.pd-filtres{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
.pd-filtre{ all:unset; box-sizing:border-box; cursor:pointer; padding:7px 14px; border-radius:999px; font-weight:700; font-size:13.5px; border:var(--trait-doux); background:#fff; }
.pd-filtre.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
.pd-filtre:focus-visible{ outline:2px solid var(--tur); outline-offset:2px; }
.pd-info{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:12px 16px; margin:0 0 18px; border-radius:var(--r-m); background:color-mix(in srgb, var(--jaune) 22%, #fff); border:1.5px solid #C98A00; font-size:14px; }
.pd-info span{ flex:1; min-width:220px; }
.pd-grille{ display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:16px; }
.pd-carte{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; gap:14px; padding:18px; border-radius:var(--r-l); background:#fff; border:var(--trait); box-shadow:4px 4px 0 var(--aplat); transition:transform .15s, box-shadow .15s; }
.pd-carte:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--aplat-fort); }
.pd-carte:focus-visible{ outline:2px solid var(--tur); outline-offset:3px; }
.pd-carte.retard{ box-shadow:4px 4px 0 color-mix(in srgb, var(--mag) 40%, transparent); }
.pd-carte.atteint{ box-shadow:4px 4px 0 color-mix(in srgb, var(--vert) 45%, transparent); }
.pd-carte-tete{ display:flex; gap:14px; align-items:center; }
.pd-anneau{ flex:none; }
.pd-sur{ font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
.pd-carte h3{ margin:2px 0 4px; font-size:18px; line-height:1.25; }
.pd-periode{ font-size:13px; opacity:.75; }
.pd-chiffres{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.pd-chiffres div{ display:flex; flex-direction:column; padding:8px 10px; border-radius:var(--r-s); background:var(--fond-doux); }
.pd-chiffres b{ font-family:var(--police-titre); font-size:22px; line-height:1.1; }
.pd-chiffres span{ font-size:12px; opacity:.7; }
.pd-prod{ display:grid; grid-template-columns:minmax(80px, 1fr) 2fr auto; gap:8px; align-items:center; font-size:13px; }
.pd-piste{ height:10px; border-radius:999px; background:var(--fond-doux); border:1px solid color-mix(in srgb, var(--navy) 25%, transparent); overflow:hidden; }
.pd-piste i{ display:block; height:100%; background:var(--tur); }
.pd-pied{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:auto; }
.pd-tag{ display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; background:var(--fond-doux); }
.pd-tag.ok{ background:color-mix(in srgb, var(--vert) 16%, #fff); color:#14633A; }
.pd-tag.alerte{ background:color-mix(in srgb, var(--mag) 14%, #fff); color:#A3154A; }
.pd-tag.jours{ margin-left:auto; background:#fff; border:var(--trait-doux); }
/* Détail */
.pd-voile{ position:fixed; inset:0; z-index:550; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:color-mix(in srgb, var(--navy) 45%, transparent); }
.pd-detail{ width:min(1000px, 100%); max-height:calc(100vh - 48px); overflow:auto; background:#fff; border:var(--trait); border-radius:var(--r-xl); box-shadow:6px 6px 0 var(--aplat-fort); padding:22px 26px; display:flex; flex-direction:column; gap:16px; }
.pd-detail-tete{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.pd-detail-tete h2{ margin:4px 0 0; font-size:25px; }
.pd-colonnes{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
.pd-bloc{ border:var(--trait-doux); border-radius:var(--r-m); padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.pd-bloc h3{ margin:0; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.65; }
.pd-obj{ display:flex; flex-direction:column; gap:4px; }
.pd-obj-l{ display:flex; justify-content:space-between; gap:8px; font-size:13.5px; }
.pd-obj-l span{ opacity:.7; }
.pd-obj.sous{ padding-left:12px; }
.pd-aide{ margin:0; font-size:13px; opacity:.72; line-height:1.45; }
.pd-jalons{ display:flex; flex-direction:column; gap:0; }
.pd-jalons div{ position:relative; padding:6px 0 6px 20px; font-size:13.5px; border-left:1.5px solid color-mix(in srgb, var(--navy) 25%, transparent); margin-left:6px; }
.pd-jalons div::before{ content:""; position:absolute; left:-6px; top:10px; width:10px; height:10px; border-radius:50%; background:#fff; border:1.5px solid var(--navy); }
.pd-jalons div.passe::before{ background:var(--tur); }
.pd-jalons div.fin::before{ border-radius:2px; transform:rotate(45deg); background:var(--mag); }
.pd-table{ width:100%; border-collapse:collapse; font-size:13px; }
.pd-table th{ text-align:left; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.6; padding:6px 8px; border-bottom:var(--trait-doux); }
.pd-table td{ padding:7px 8px; border-bottom:1px solid color-mix(in srgb, var(--navy) 10%, transparent); }
.pd-table-zone{ max-height:260px; overflow:auto; }
.pd-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:space-between; border-top:var(--pointille); padding-top:14px; }
@media (max-width:760px){ .pd-colonnes{ grid-template-columns:1fr; } .pd-voile{ padding:0; align-items:flex-end; } .pd-detail{ max-height:94vh; border-radius:22px 22px 0 0; padding:18px 16px; } }
</style>
<script src="portail-ui.js?v=24" defer></script>
<script src="cvdl-ui.js?v=11" defer></script>
<script src="assistant-portail.js?v=1" defer></script>
<link rel="stylesheet" href="retours.css?v=1">
<script src="retours.js?v=1" defer></script>
</head>
<body data-famille="commandes">

<script>
try{ if(sessionStorage.getItem('cvdl-code-structure')) document.documentElement.classList.add('deja-identifie'); }catch(e){}
</script>
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>
<button type="button" class="btn-deconnexion-fixe" id="btn-deconnexion" hidden>
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Déconnexion
</button>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" onclick="location.href='portail-structure.html'">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <div id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Projets de <em>distribution</em></h1>
      <p style="opacity:0.6;margin:0">Identifiez-vous avec votre code structure. Réservé aux structures Interne.</p>
      <div class="field">
        <label for="id-code" class="sr-only">Code structure</label>
        <input type="text" class="input" id="id-code" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-id-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-verifier-code">Continuer</button>
    </div>
  </div>

  <div id="etape-projets" hidden>
    <div class="pd-tete">
      <div>
        <span data-ill="distribution" class="pk-titre-ill xl"></span>
        <h1 style="margin-bottom:var(--space-2)">Projets de <em>distribution</em></h1>
        <p>Suivez vos projets (financeur, période, objectifs) : chaque appareil « Remis » de votre flotte peut être rattaché à un projet, et compte dans son avancement.</p>
      </div>
      <button type="button" class="btn btn-primary" id="btn-nouveau-projet" data-role="responsable">+ Nouveau projet</button>
    </div>
    <div id="pd-info"></div>
    <div class="pd-filtres" id="pd-filtres" role="toolbar" aria-label="Filtrer les projets"></div>
    <div id="retour-projets" aria-live="polite"></div>
    <div id="pd-liste"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
function echapper(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function poster(data){ return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data) }).then(r => r.json()); }
function jsonp(params){ return fetch(API + '?' + new URLSearchParams(params)).then(r => r.json()); }
function frDate(iso){ const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '—'); }
function isoJour(d){ const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
const pluriel = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;

let codeValide = '';
let donnees = { projets: [], produits: [], icones: {}, remisSansProjet: 0 };
let filtre = 'cours';

function phase(p){
  if(p.statut === 'archive') return 'archives';
  const auj = isoJour(new Date());
  if(p.debut && p.debut > auj) return 'avenir';
  if(p.butoir && p.butoir < auj) return 'termines';
  return 'cours';
}
function tagRythme(av){
  if(!av) return '';
  if(av.reste === 0) return '<span class="pd-tag ok">Objectif atteint</span>';
  if(av.joursRestants != null && av.joursRestants < 0) return '<span class="pd-tag alerte">Terminé · objectif non atteint</span>';
  if(av.enRetard) return `<span class="pd-tag alerte" title="Rythme actuel ~${av.rythmeActuel}/sem.">En retard : ~${av.rythmeNecessaire}/sem. à distribuer</span>`;
  return '<span class="pd-tag ok">Dans le rythme</span>';
}
function anneau(pct){
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="pd-anneau" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
    <circle cx="34" cy="34" r="${r + 5}" fill="color-mix(in srgb, #002743 14%, transparent)"/>
    <circle cx="32" cy="32" r="${r + 5}" fill="#fff" stroke="#002743" stroke-width="1.4"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#EEF2F5" stroke-width="7"/>
    ${pct ? `<circle cx="32" cy="32" r="${r}" fill="none" stroke="#00ACB0" stroke-width="7" stroke-dasharray="${pct / 100 * c} ${c}" transform="rotate(-90 32 32)"/>` : ''}
    <text x="32" y="36.5" text-anchor="middle" font-size="12" font-weight="700" fill="#002743" font-family="Space Grotesk, system-ui">${pct}%</text></svg>`;
}

/* ── Liste ── */
function afficher(){
  const liste = donnees.projets || [];
  const compte = k => liste.filter(p => phase(p) === k).length;
  $('pd-filtres').innerHTML = [['cours', 'En cours'], ['avenir', 'À venir'], ['termines', 'Terminés'], ['archives', 'Archivés']]
    .map(([k, l]) => `<button type="button" class="pd-filtre${filtre === k ? ' on' : ''}" data-filtre="${k}" aria-pressed="${filtre === k}">${l} (${compte(k)})</button>`).join('');
  const n = donnees.remisSansProjet || 0;
  $('pd-info').innerHTML = n && liste.some(p => p.statut !== 'archive')
    ? `<div class="pd-info"><span><b>${pluriel(n, 'appareil remis', 'appareils remis')}</b> ne ${n > 1 ? 'sont' : 'est'} rattaché${n > 1 ? 's' : ''} à aucun projet. Choisissez le projet dans « Ma flotte », sur chaque appareil remis.</span><a class="btn btn-secondary" href="flotte-structure.html">Ouvrir ma flotte</a></div>` : '';
  const visibles = liste.filter(p => phase(p) === filtre);
  $('pd-liste').innerHTML = visibles.length ? `<div class="pd-grille">${visibles.map(p => {
    const av = p.avancement || {};
    const tot = av.totalObjectif || 0, liv = av.totalLivre || 0;
    const pct = tot ? Math.min(100, Math.round(liv / tot * 100)) : 0;
    const jours = av.joursRestants != null && av.joursRestants >= 0 ? av.joursRestants : null;
    const produits = (av.objectifs || []).filter(o => o.objectif || o.livre);
    return `<button type="button" class="pd-carte${av.enRetard && av.reste ? ' retard' : ''}${av.reste === 0 ? ' atteint' : ''}" data-ouvrir="${echapper(p.id)}" aria-label="Ouvrir ${echapper(p.nom)}">
      <div class="pd-carte-tete">${anneau(pct)}
        <div>${p.financeur ? `<div class="pd-sur">${echapper(p.financeur)}</div>` : ''}<h3>${echapper(p.nom)}</h3>
        <div class="pd-periode">${p.debut ? frDate(p.debut) : '…'} → <b>${p.butoir ? frDate(p.butoir) : 'sans date butoir'}</b></div></div></div>
      <div class="pd-chiffres">
        <div><b>${liv}</b><span>distribué${liv > 1 ? 's' : ''}</span></div>
        <div><b>${av.reste != null ? av.reste : Math.max(0, tot - liv)}</b><span>reste</span></div>
        <div><b>${tot || '—'}</b><span>objectif</span></div>
      </div>
      ${produits.length ? `<div style="display:flex;flex-direction:column;gap:6px">${produits.slice(0, 3).map(o => { const b = Math.max(o.objectif || 0, o.livre, 1); return `<div class="pd-prod"><span>${echapper(o.produit)}</span><span class="pd-piste"><i style="width:${Math.min(100, o.livre / b * 100)}%"></i></span><small>${o.livre}${o.objectif ? `/${o.objectif}` : ''}</small></div>`; }).join('')}</div>` : ''}
      <div class="pd-pied">${tagRythme(av)}${jours != null ? `<span class="pd-tag jours">J-${jours}</span>` : ''}</div>
    </button>`; }).join('')}</div>`
    : `<div class="pk-etat pk-vide"><span data-ill="vide"></span>${liste.length ? 'Aucun projet dans ce filtre.' : 'Aucun projet pour l’instant : créez le premier avec « Nouveau projet ».'}</div>`;
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-filtre]'); if(f){ filtre = f.dataset.filtre; afficher(); return; }
  const o = e.target.closest('[data-ouvrir]'); if(o){ ouvrirDetail(o.dataset.ouvrir); return; }
});

async function charger(){
  $('retour-projets').innerHTML = '<div class="pk-etat pk-chargement"><span class="spinner-inline"></span>Chargement…</div>';
  try{
    const r = await jsonp({ action: 'projets-structure', code: codeValide });
    if(!r.ok){ $('retour-projets').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Chargement impossible.')}</div>`; return; }
    donnees = r;
    $('retour-projets').innerHTML = '';
    afficher();
  }catch(e){ $('retour-projets').innerHTML = '<div class="msg msg-erreur">Chargement impossible — réessayez.</div>'; }
}

/* ── Détail d'un projet ── */
function barre(o, echelle, sous){
  const base = Math.max(o.objectif || echelle || 0, o.livre, 1);
  return `<div class="pd-obj${sous ? ' sous' : ''}"><div class="pd-obj-l"><b>${echapper(o.produit)}</b><span>${o.livre} distribué${o.livre > 1 ? 's' : ''}${o.objectif ? ` / ${o.objectif}` : ''}${o.objectif && o.livre > o.objectif ? ' · dépassé' : ''}</span></div>
    <div class="pd-piste" role="img" aria-label="${echapper(o.produit)} : ${o.livre} sur ${o.objectif || '—'}"><i style="width:${Math.min(100, o.livre / base * 100)}%"></i></div></div>`;
}
function barres(av){
  const l = av.objectifs || [];
  if(!av.global) return l.map(o => barre(o)).join('');
  return barre({ produit: 'Total', objectif: av.totalObjectif, livre: av.totalLivre }) + l.filter(o => o.objectif || o.livre).map(o => barre(o, av.totalObjectif, true)).join('');
}
function fermerDetail(){ const v = document.querySelector('.pd-voile'); if(v) v.remove(); document.removeEventListener('keydown', escDetail); }
function escDetail(e){ if(e.key === 'Escape' && !document.querySelector('.ap-voile')) fermerDetail(); }
function ouvrirDetail(id){
  const p = donnees.projets.find(x => x.id === id); if(!p) return;
  fermerDetail();
  const av = p.avancement || { objectifs: [], appareils: [] };
  const auj = isoJour(new Date());
  const jalons = [...(p.jalons || []), ...(p.butoir ? [{ date: p.butoir, libelle: 'Date butoir', fin: true }] : [])].sort((a, b) => a.date.localeCompare(b.date));
  const v = document.createElement('div');
  v.className = 'pd-voile';
  v.innerHTML = `<div class="pd-detail" role="dialog" aria-modal="true" aria-labelledby="pd-titre">
    <div class="pd-detail-tete"><div><div class="pd-sur">${echapper([p.financeur, `${p.debut ? frDate(p.debut) : '…'} → ${p.butoir ? frDate(p.butoir) : '…'}`].filter(Boolean).join(' · '))}</div><h2 id="pd-titre">${echapper(p.nom)}</h2></div>
      <button type="button" class="ap-fermer" data-fermer-detail aria-label="Fermer">×</button></div>
    <div class="pd-pied">${p.reference ? `<span class="pd-tag">Réf. ${echapper(p.reference)}</span>` : ''}${p.statut === 'archive' ? '<span class="pd-tag">Archivé</span>' : ''}${tagRythme(av)}</div>
    ${p.description ? `<p class="pd-aide">${echapper(p.description)}</p>` : ''}
    <div class="pd-colonnes">
      <section class="pd-bloc"><h3>Avancement</h3>${barres(av) || '<p class="pd-aide">Aucun objectif.</p>'}
        ${av.enRetard && av.rythmeNecessaire ? `<p class="pd-aide">Rythme nécessaire : ~${av.rythmeNecessaire} appareil(s) par semaine jusqu’au ${frDate(p.butoir)} (rythme actuel ~${av.rythmeActuel}).${av.projection ? ` À ce rythme, objectif atteint vers le ${frDate(av.projection)}.` : ''}</p>` : ''}
        ${av.dejaDistribues ? `<p class="pd-aide">Dont <b>${pluriel(av.dejaDistribues, 'appareil distribué', 'appareils distribués')}</b> avant le suivi dans la plateforme.</p>` : ''}
        <h3 style="margin-top:6px">Appareils rattachés (${(av.appareils || []).length})</h3>
        ${(av.appareils || []).length ? `<div class="pd-table-zone"><table class="pd-table"><thead><tr><th>N° de série</th><th>Produit</th><th>Remis le</th></tr></thead><tbody>${av.appareils.map(a => `<tr><td><span class="pk-sn">${echapper(a.numeroSerie)}</span></td><td>${echapper(a.produit)}</td><td>${echapper(frDate(a.dateRemise) || '—')}</td></tr>`).join('')}</tbody></table></div>`
          : '<p class="pd-aide">Aucun appareil pour l’instant. Dans « Ma flotte », choisissez ce projet sur un appareil au statut « Remis ».</p>'}
      </section>
      <section class="pd-bloc"><h3>Points d’étape</h3>
        ${jalons.length ? `<div class="pd-jalons">${jalons.map(j => `<div class="${j.date < auj ? 'passe' : ''}${j.fin ? ' fin' : ''}"><b>${frDate(j.date)}</b> · ${echapper(j.libelle || 'Point d’étape')}${j.quantite ? ` <span style="opacity:.7">— objectif ${j.quantite}</span>` : ''}</div>`).join('')}</div>` : '<p class="pd-aide">Aucun point d’étape.</p>'}
        <h3 style="margin-top:6px">En chiffres</h3>
        <p class="pd-aide">${pluriel(av.totalLivre || 0, 'appareil distribué', 'appareils distribués')}, ${pluriel(av.totalLivre || 0, 'personne équipée', 'personnes équipées')}${av.joursRestants != null && av.joursRestants >= 0 ? ` · ${pluriel(av.joursRestants, 'jour restant', 'jours restants')}` : ''}.</p>
      </section>
    </div>
    <div class="pd-actions">
      <button type="button" class="btn btn-ghost" data-role="responsable" data-archiver="${echapper(p.id)}" data-etat="${p.statut === 'archive' ? '0' : '1'}">${p.statut === 'archive' ? 'Désarchiver' : 'Archiver'}</button>
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn btn-secondary" data-exporter="${echapper(p.id)}">Exporter (CSV)</button><button type="button" class="btn btn-primary" data-role="responsable" data-modifier="${echapper(p.id)}">Modifier</button></span>
    </div></div>`;
  document.body.appendChild(v);
  if(window.portailIllustrations) window.portailIllustrations(v);
  document.addEventListener('keydown', escDetail);
  v.addEventListener('click', async e => {
    if(e.target === v || e.target.closest('[data-fermer-detail]')){ fermerDetail(); return; }
    if(e.target.closest('[data-modifier]')){ ouvrirAssistant(p); return; }
    if(e.target.closest('[data-exporter]')){ exporterCsv(p); return; }
    const a = e.target.closest('[data-archiver]');
    if(a){
      const archiver = a.dataset.etat === '1';
      if(archiver && window.confirmerCvdl && !await confirmerCvdl('Archiver ce projet ?\n\nOn ne pourra plus y rattacher d’appareil ; son historique reste consultable (filtre « Archivés »).')) return;
      a.disabled = true;
      const r = await poster({ action: 'projet-structure-archiver', code: codeValide, id: p.id, archive: archiver });
      if(r && r.ok){ fermerDetail(); await charger(); }
      else { a.disabled = false; alert((r && r.erreur) || 'Enregistrement impossible.'); }
    }
  });
}
function exporterCsv(p){
  const lignes = [['Projet', 'Financeur', 'Référence', 'N° de série', 'Produit', 'Remis le']];
  ((p.avancement || {}).appareils || []).forEach(a => lignes.push([p.nom, p.financeur, p.reference, a.numeroSerie, a.produit, frDate(a.dateRemise)]));
  const csv = '﻿' + lignes.map(l => l.map(x => `"${String(x == null ? '' : x).replace(/"/g, '""')}"`).join(';')).join('\n');
  const lien = document.createElement('a');
  lien.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  lien.download = `projet-${p.id}.csv`; lien.click();
  setTimeout(() => URL.revokeObjectURL(lien.href), 2000);
}

/* ── Création / modification : assistant en étapes (assistant-portail.js) ── */
const ETAPES = [
  { cle: 'projet', titre: 'Projet', ill: 'distribution', h: 'Quel projet ?', p: 'Son nom et, si besoin, le financeur et la référence de la convention.' },
  { cle: 'periode', titre: 'Période', ill: 'calendrier', h: 'Sur quelle période ?', p: 'La date butoir sert à calculer le rythme à tenir.' },
  { cle: 'objectifs', titre: 'Objectifs', ill: 'stats', h: 'Combien d’appareils à distribuer ?', p: 'Un objectif global, et/ou une quantité par produit. Seuls les produits listés pourront être rattachés au projet (sans liste : tous).' },
  { cle: 'jalons', titre: 'Points d’étape', ill: 'calendrier', h: 'Des points d’étape ?', p: 'Facultatif : bilans intermédiaires, rendus au financeur…' },
  { cle: 'recap', titre: 'Récapitulatif', ill: 'attestations', h: 'Tout est bon ?', p: 'Relisez avant d’enregistrer — chaque bloc se modifie d’un clic.' },
];
function valeurs(p){
  return {
    id: p ? p.id : '', nom: p ? p.nom : '', financeur: p ? p.financeur : '', reference: p ? p.reference : '', description: p ? p.description : '',
    debut: p ? p.debut : isoJour(new Date()), butoir: p ? p.butoir : '',
    objectifGlobal: p && p.objectifGlobal ? String(p.objectifGlobal) : '',
    objectifs: p ? p.objectifs.map(o => ({ produit: o.produit, quantite: o.quantite ? String(o.quantite) : '' })) : [{ produit: '', quantite: '' }],
    jalons: p ? p.jalons.map(j => ({ date: j.date, libelle: j.libelle || '', quantite: j.quantite ? String(j.quantite) : '' })) : [],
    deja: p && p.deja ? p.deja.map(d => ({ produit: d.produit || '', quantite: String(d.quantite) })) : [],
  };
}
function corps(cle, v){
  const e = echapper;
  if(cle === 'projet') return `<div class="ap-grille">
    <div class="field ap-large"><label for="pj-nom">Nom du projet *</label><input class="input" id="pj-nom" data-ap="nom" value="${e(v.nom)}" maxlength="120" placeholder="Ex : Rentrée numérique des étudiants" autocomplete="off"></div>
    <div class="field"><label for="pj-fin">Financeur / partenaire <em>(facultatif)</em></label><input class="input" id="pj-fin" data-ap="financeur" value="${e(v.financeur)}" maxlength="120" placeholder="Ex : Région, fondation…"></div>
    <div class="field"><label for="pj-ref">Référence <em>(facultatif)</em></label><input class="input" id="pj-ref" data-ap="reference" value="${e(v.reference)}" maxlength="80" placeholder="Ex : convention 2026-14"></div>
    <div class="field ap-large"><label for="pj-desc">Description <em>(facultatif)</em></label><textarea class="input" id="pj-desc" data-ap="description" rows="3" maxlength="500" placeholder="Public visé, lieu, ce qui est attendu…">${e(v.description)}</textarea></div>
  </div>`;
  if(cle === 'periode') return `<div class="ap-grille">
    <div class="field"><label for="pj-debut">Début</label><input class="input" type="date" id="pj-debut" data-ap="debut" value="${e(v.debut)}"></div>
    <div class="field"><label for="pj-butoir">Date butoir</label><input class="input" type="date" id="pj-butoir" data-ap="butoir" value="${e(v.butoir)}"></div>
    <p class="ap-aide ap-large">Sans date butoir, le projet reste « en cours » et aucun rythme n’est calculé.</p>
  </div>`;
  if(cle === 'objectifs'){
    const options = sel => `<option value="">Choisir un produit…</option>${donnees.produits.map(n => `<option ${sel === n ? 'selected' : ''}>${e(n)}</option>`).join('')}${sel && !donnees.produits.includes(sel) ? `<option selected>${e(sel)}</option>` : ''}`;
    return `
    <section class="ap-section"><h4>Objectif global <em>— tous produits confondus, facultatif</em></h4>
      <div class="field" style="max-width:220px"><input class="input" type="number" min="1" data-ap="objectifGlobal" value="${e(v.objectifGlobal)}" placeholder="Ex : 40" aria-label="Objectif global" inputmode="numeric"></div></section>
    <section class="ap-section"><h4>Par produit</h4>
      <div class="ap-lignes">${v.objectifs.map((o, i) => `<div class="ap-ligne"><select class="input" data-obj="produit" data-i="${i}" aria-label="Produit">${options(o.produit)}</select>
        <input class="input" type="number" min="1" data-obj="quantite" data-i="${i}" value="${e(o.quantite)}" placeholder="Quantité" aria-label="Quantité" inputmode="numeric">
        <button type="button" class="ap-suppr" data-obj-suppr="${i}" aria-label="Retirer ce produit">×</button></div>`).join('')}</div>
      <button type="button" class="btn btn-secondary ap-ajout" data-obj-ajout>+ Ajouter un produit</button>
      <p class="ap-aide">Avec un objectif global, la quantité par produit est facultative : une ligne sans quantité limite simplement les produits comptés.</p></section>
    <section class="ap-section"><h4>Déjà distribués avant le suivi <em>— facultatif</em></h4>
      <p class="ap-aide">Projet déjà commencé ? Indiquez les appareils remis avant de le suivre ici : ils comptent dans l’avancement dès la date de début.</p>
      <div class="ap-lignes">${v.deja.map((d, i) => `<div class="ap-ligne"><select class="input" data-deja="produit" data-i="${i}" aria-label="Produit"><option value="">Sans produit précisé</option>${donnees.produits.map(n => `<option ${d.produit === n ? 'selected' : ''}>${e(n)}</option>`).join('')}</select>
        <input class="input" type="number" min="1" data-deja="quantite" data-i="${i}" value="${e(d.quantite)}" placeholder="Nombre" aria-label="Nombre déjà distribué" inputmode="numeric">
        <button type="button" class="ap-suppr" data-deja-suppr="${i}" aria-label="Retirer">×</button></div>`).join('')}</div>
      <button type="button" class="btn btn-secondary ap-ajout" data-deja-ajout>+ Ajouter des appareils déjà distribués</button></section>`;
  }
  if(cle === 'jalons') return `<div class="ap-lignes">${v.jalons.map((j, i) => `<div class="ap-ligne jalon"><input class="input" type="date" data-jal="date" data-i="${i}" value="${e(j.date)}" aria-label="Date">
      <input class="input" data-jal="libelle" data-i="${i}" value="${e(j.libelle)}" maxlength="80" placeholder="Ex : Bilan intermédiaire" aria-label="Libellé">
      <input class="input" type="number" min="1" data-jal="quantite" data-i="${i}" value="${e(j.quantite)}" placeholder="Objectif" aria-label="Objectif à cette date" inputmode="numeric">
      <button type="button" class="ap-suppr" data-jal-suppr="${i}" aria-label="Retirer ce point d’étape">×</button></div>`).join('') || '<p class="ap-aide">Aucun point d’étape pour l’instant.</p>'}</div>
    <button type="button" class="btn btn-secondary ap-ajout" data-jal-ajout>+ Ajouter un point d’étape</button>`;
  const obj = v.objectifs.filter(o => o.produit);
  const bloc = (i, titre, lignes) => `<section class="ap-recap-bloc"><div class="ap-recap-tete"><h4>${titre}</h4><button type="button" class="ap-lien" data-ap-aller="${i}">Modifier</button></div>
    ${lignes.map(([k, val]) => `<div class="ap-recap-l"><span>${k}</span><b>${val ? e(val) : '<em>—</em>'}</b></div>`).join('')}</section>`;
  return `<div class="ap-recap">
    ${bloc(0, 'Projet', [['Nom', v.nom], ['Financeur', v.financeur], ['Référence', v.reference]])}
    ${bloc(1, 'Période', [['Début', frDate(v.debut)], ['Date butoir', v.butoir ? frDate(v.butoir) : 'Aucune']])}
    ${bloc(2, 'Objectifs', [['Global', v.objectifGlobal], ...(obj.length ? obj.map(o => [o.produit, o.quantite || 'compté']) : [['Produits', 'Tous']]),
      ...v.deja.filter(d => parseInt(d.quantite, 10) > 0).map(d => ['Déjà distribués', `${d.quantite} × ${d.produit || 'sans produit précisé'}`])])}
    ${bloc(3, 'Points d’étape', v.jalons.filter(j => j.date).length ? v.jalons.filter(j => j.date).map(j => [frDate(j.date), [j.libelle, j.quantite ? `objectif ${j.quantite}` : ''].filter(Boolean).join(' · ') || 'Point d’étape']) : [['—', 'Aucun']])}
  </div>`;
}
function projetEnvoye(v){
  const global = parseInt(v.objectifGlobal, 10) || 0;
  return {
    id: v.id, nom: v.nom.trim(), financeur: v.financeur.trim(), reference: v.reference.trim(), description: v.description.trim(),
    debut: v.debut, butoir: v.butoir, objectifGlobal: global,
    objectifs: v.objectifs.filter(o => o.produit).map(o => ({ produit: o.produit, quantite: parseInt(o.quantite, 10) || 0 })).filter(o => o.quantite > 0 || global > 0),
    jalons: v.jalons.filter(j => j.date).map(j => ({ date: j.date, libelle: j.libelle.trim(), quantite: parseInt(j.quantite, 10) || 0 })),
    deja: v.deja.map(d => ({ produit: d.produit, quantite: parseInt(d.quantite, 10) || 0 })).filter(d => d.quantite > 0),
  };
}
function verifier(cle, v){
  if(cle === 'projet' && !v.nom.trim()) return 'Donnez un nom au projet.';
  if(cle === 'periode' && v.debut && v.butoir && v.butoir < v.debut) return 'La date butoir est avant la date de début.';
  if(cle === 'objectifs'){
    const p = projetEnvoye(v);
    if(!p.objectifGlobal && !p.objectifs.some(o => o.quantite > 0)) return 'Fixez un objectif : un total d’appareils, ou une quantité pour au moins un produit.';
    const noms = v.objectifs.filter(o => o.produit).map(o => o.produit);
    if(new Set(noms).size !== noms.length) return 'Un produit apparaît deux fois.';
  }
  return '';
}
function ouvrirAssistant(p){
  AssistantPortail.ouvrir({
    surtitre: p ? 'Modifier le projet' : 'Nouveau projet de distribution',
    titre: v => v.nom.trim() || 'Nouveau projet', etapes: ETAPES, v: valeurs(p), modification: !!p,
    libelleFin: p ? 'Enregistrer' : 'Créer le projet', corps, verifier,
    saisie: (el, v) => {
      if(el.dataset.obj) v.objectifs[+el.dataset.i][el.dataset.obj] = el.value;
      if(el.dataset.jal) v.jalons[+el.dataset.i][el.dataset.jal] = el.value;
      if(el.dataset.deja) v.deja[+el.dataset.i][el.dataset.deja] = el.value;
    },
    clic: (e, v, rendre) => {
      if(e.target.closest('[data-obj-ajout]')){ v.objectifs.push({ produit: '', quantite: '' }); rendre(); return; }
      if(e.target.closest('[data-jal-ajout]')){ v.jalons.push({ date: '', libelle: '', quantite: '' }); rendre(); return; }
      if(e.target.closest('[data-deja-ajout]')){ v.deja.push({ produit: '', quantite: '' }); rendre(); return; }
      const sd = e.target.closest('[data-deja-suppr]'); if(sd){ v.deja.splice(+sd.dataset.dejaSuppr, 1); rendre(); return; }
      const so = e.target.closest('[data-obj-suppr]'); if(so){ v.objectifs.splice(+so.dataset.objSuppr, 1); rendre(); return; }
      const sj = e.target.closest('[data-jal-suppr]'); if(sj){ v.jalons.splice(+sj.dataset.jalSuppr, 1); rendre(); }
    },
    terminer: async v => {
      const r = await poster({ action: 'projet-structure-enregistrer', code: codeValide, projet: projetEnvoye(v) });
      if(r && r.ok){ fermerDetail(); await charger(); if(!p) filtre = phase({ debut: v.debut, butoir: v.butoir }); afficher(); if(r.id) ouvrirDetail(r.id); }
      return r;
    },
  });
}
$('btn-nouveau-projet').addEventListener('click', () => ouvrirAssistant(null));

/* ── Identification (code structure, Interne uniquement) ── */
async function verifierCode(){
  const code = $('id-code').value.trim();
  if(!code){ $('retour-id-code').innerHTML = '<div class="msg msg-erreur">Saisissez votre code structure.</div>'; return; }
  $('btn-verifier-code').disabled = true;
  $('btn-verifier-code').innerHTML = '<span class="spinner-inline"></span>Vérification…';
  $('retour-id-code').innerHTML = '';
  try{
    const r = await jsonp({ action: 'check', code });
    if(!r.ok) $('retour-id-code').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Code invalide.')}</div>`;
    else if(!r.interne) $('retour-id-code').innerHTML = '<div class="msg msg-erreur">Les projets de distribution sont réservés aux structures Interne.</div>';
    else{
      codeValide = code;
      try{ sessionStorage.setItem('cvdl-code-structure', code); }catch(e){}
      $('etape-code').hidden = true; $('etape-projets').hidden = false; $('btn-deconnexion').hidden = false;
      await charger();
    }
  }catch(e){ $('retour-id-code').innerHTML = '<div class="msg msg-erreur">Connexion impossible. Réessayez.</div>'; }
  $('btn-verifier-code').disabled = false;
  $('btn-verifier-code').textContent = 'Continuer';
}
$('btn-verifier-code').addEventListener('click', verifierCode);
$('id-code').addEventListener('keydown', e => { if(e.key === 'Enter') verifierCode(); });
$('btn-deconnexion').addEventListener('click', () => { try{ sessionStorage.removeItem('cvdl-code-structure'); }catch(e){} location.reload(); });
try{
  const codeMemorise = sessionStorage.getItem('cvdl-code-structure');
  if(codeMemorise){
    $('id-code').value = codeMemorise;
    verifierCode().finally(() => {
      document.documentElement.classList.remove('deja-identifie');
      const v = $('voile-verification-precoce'); if(v) v.style.display = 'none';
    });
  }
}catch(e){}
</script>
