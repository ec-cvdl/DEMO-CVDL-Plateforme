<!DOCTYPE html>
<html lang="fr">
<head>
<script src="api.js?v=2"></script>
<script src="commun.js?v=1"></script>
<meta charset="utf-8">
<script src="anti-cadre.js?v=1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=35">
<style>
/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1180px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner .7s linear infinite; margin-right:8px; vertical-align:-2px; }
@keyframes tourner{ to{ transform:rotate(360deg); } }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#voile-verification-precoce .spinner-precoce{ width:34px; height:34px; animation:tourner .8s linear infinite; }
.carte-partenaire{ display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); padding:var(--space-4); }
.carte-partenaire .sous{ margin-top:2px; }
.btn-modifier-partenaire{ box-sizing:border-box; cursor:pointer; padding:7px 12px; display:inline-flex; align-items:center; gap:5px; flex:none; }
.btn-deconnexion-fixe{ position:fixed; top:var(--space-4); right:var(--space-4); z-index:150; display:flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer; }
.voile-modale-qr{ display:none; position:fixed; inset:0; z-index:500; align-items:center; justify-content:center; padding:20px; }
.voile-modale-qr.visible{ display:flex; }
.modale-qr{ padding:var(--space-6); max-width:420px; width:100%; }
.modale-qr h2, .modale-qr h3{ margin:0 0 4px; }
.modale-qr p{ margin:0 0 var(--space-4); opacity:0.6; }
@media (max-width: 640px){
main{ padding:var(--space-6) var(--space-4); }
}
</style>
<script src="portail-ui.js?v=36" defer></script>
<script src="cvdl-ui.js?v=13" defer></script>
<link rel="stylesheet" href="retours.css?v=2">
<script src="retours.js?v=2" defer></script>
<link rel="stylesheet" href="notifications-portail.css?v=1">
<link rel="stylesheet" href="calendrier.css?v=1">
</head>
<body data-famille="commandes">
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>
<button type="button" class="btn-deconnexion-fixe" id="btn-deconnexion-cal" hidden>
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Déconnexion
</button>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" data-aller="portail-structure.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <div id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Calendrier</h1>
      <p style="opacity:0.6;margin:0">Identifiez-vous avec votre code structure.</p>
      <div class="field">
        <label for="id-code" class="sr-only">Code structure</label>
        <input type="text" class="input" id="id-code" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-id-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-verifier-code">Continuer</button>
    </div>
  </div>

  <div id="etape-cal" hidden>
    <div class="cx-t">
      <span data-ill="calendrier" class="pk-titre-ill xl"></span>
      <div>
        <div class="cvdl-surtitre">Ma structure</div>
        <h1>Calendrier</h1>
        <p>Livraisons de vos commandes et échéances de paiement des personnes.</p>
      </div>
    </div>
    <div id="cx-erreur"></div>
    <div class="cx-g">
      <section class="cx-c" aria-labelledby="cx-mois">
        <div class="cx-nav">
          <span class="cx-m"><button type="button" id="cx-prec" aria-label="Mois précédent">‹</button><b id="cx-mois" aria-live="polite"></b><button type="button" id="cx-suiv" aria-label="Mois suivant">›</button></span>
          <span class="cx-fl" role="group" aria-label="Afficher">
            <button type="button" aria-pressed="true" data-cx-type="livraison"><span class="d v"></span>Livraisons <i id="cx-n-livraison"></i></button>
            <button type="button" aria-pressed="true" data-cx-type="paiement"><span class="d r"></span>Paiements <i id="cx-n-paiement"></i></button>
          </span>
        </div>
        <div class="cx-s" id="cx-grille" role="grid"></div>
        <div class="cx-leg">
          <span><span class="d v"></span>Livrée</span><span><span class="d y"></span>Livraison prévue</span><span><span class="d o"></span>Date souhaitée</span><span><span class="d r"></span>Paiement en retard</span><span><span class="d b"></span>Échéance à venir</span><span><span class="d g"></span>Payée</span>
        </div>
      </section>
      <div class="cx-r">
        <section class="cx-c" aria-labelledby="cx-jour-titre"><h2 id="cx-jour-titre">Aujourd’hui</h2><div id="cx-jour"></div></section>
        <section class="cx-c" aria-labelledby="cx-avenir-titre"><h2 id="cx-avenir-titre">30 prochains jours</h2><div id="cx-avenir"></div></section>
      </div>
    </div>
  </div>
</main>

<script src="deja-identifie.js?v=1"></script>
<script src="notifications-portail.js?v=1"></script>
<script src="pages/calendrier.js?v=1"></script>
</body>
</html>
