<!DOCTYPE html>
<html lang="fr">
<head>
<script src="api.js?v=2"></script>
<script src="commun.js?v=1"></script>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<script src="anti-cadre.js?v=1"></script>
<title>Passeport de l'appareil — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=35">
<script src="qrcode.min.js"></script>
<style>
/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
main{ max-width:1040px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
.recherche-passeport{ display:flex; gap:8px; margin-bottom:8px; }
.recherche-passeport .input{ flex:1; }
.etat-passeport{ text-align:center; padding:var(--space-8) var(--space-4); opacity:0.6; }
.lien-mode-admin{ box-sizing:border-box; display:block; text-align:center; opacity:0.55; margin-top:var(--space-4); cursor:pointer; width:100%; }
.ligne-passeport{ display:flex; align-items:baseline; gap:var(--space-4); padding:var(--space-3) 0; }
.ligne-passeport .cle{ width:160px; flex:none; opacity:0.55; }
.ligne-passeport .valeur{ overflow-wrap:anywhere; }
@media (max-width: 520px){
main{ padding:var(--space-6) var(--space-4); }
.ligne-passeport{ flex-direction:column; align-items:flex-start; gap:2px; }
.ligne-passeport .cle{ width:auto; }
.recherche-passeport{ flex-wrap:wrap; }
}
.ligne-historique-passeport{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-3); }
.ligne-historique-passeport .icone{ width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; }
.btn-deconnexion-fixe{ position:fixed; top:var(--space-4); right:var(--space-4); z-index:150; display:flex; align-items:center; gap:6px; padding:9px 16px; cursor:pointer; }
@media (max-width: 640px){
}
.ligne-passeport .cle{ opacity:.6; }
.ligne-historique-passeport{ padding:6px 0 14px 34px !important; position:relative; }
.ligne-historique-passeport:last-child::before{ display:none; }
.ligne-historique-passeport .icone{ position:absolute; left:0; top:4px; width:22px !important; height:22px !important; }
.ligne-historique-passeport .icone svg{ width:12px; height:12px; }
.pp-hero{ display:grid !important; grid-template-columns:auto 1fr auto; gap:22px !important; align-items:center; padding:24px !important; margin-top:var(--space-4); }
.pp-nom{ margin:6px 0 10px; }
.pp-pastilles{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.pp-qr{ width:112px; height:112px; padding:8px; display:flex; align-items:center; justify-content:center; }
.pp-qr img, .pp-qr canvas{ width:100% !important; height:auto !important; display:block; }
.pp-grille{ display:grid; grid-template-columns:1.1fr 1fr; gap:14px; margin-top:14px; }
.pp-grille.seule{ grid-template-columns:1fr; }
.pp-bloc{ padding:20px !important; gap:10px !important; }
.pp-lignes .ligne-passeport{ padding:10px 0; }
.pp-frise{ list-style:none; margin:4px 0 0; padding:0; }
.pp-frise li{ display:grid; grid-template-columns:16px 1fr auto; gap:10px; padding-bottom:14px; position:relative; }
.pp-frise li.dernier::before{ display:none; }
.pp-frise i{ width:14px; height:14px; margin-top:2px; position:relative; z-index:1; }
.pp-frise li.dernier i{ box-sizing:border-box; }
.pp-frise small{ white-space:nowrap; }
.pp-actions{ display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap; margin-top:14px; }
@media (max-width:700px){
.pp-hero{ grid-template-columns:auto 1fr; }
.pp-qr{ grid-column:1 / -1; justify-self:center; width:140px; height:140px; }
.pp-grille{ grid-template-columns:1fr; }
.pp-actions .btn{ flex:1; justify-content:center; }
}
.sr-only{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; white-space:nowrap; }
.recherche-passeport{ align-items:center; padding:4px 4px 4px 16px; gap:6px !important; }
.recherche-passeport .input{ padding:8px 0 !important; }
.recherche-passeport .btn{ flex:none; }
#etape-recherche > .recherche-passeport{ max-width:560px; }
</style>
<script src="portail-ui.js?v=36" defer></script>
<script src="cvdl-ui.js?v=13" defer></script>
<link rel="stylesheet" href="retours.css?v=2">
<script src="retours.js?v=2" defer></script>
</head>
<body data-famille="materiel">
<button type="button" class="btn-deconnexion-fixe" id="btn-deconnexion-passeport" hidden>
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  Déconnexion
</button>
<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" data-aller="portail-structure.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <span data-ill="passeport" class="pk-titre-ill xl"></span>
  <h1 style="margin-bottom:var(--space-6)">Passeport de l'appareil</h1>

  <div id="etape-identification" class="card elev-sm" style="padding:var(--space-6);gap:var(--space-4);max-width:460px;margin:0 auto">
    <span data-ill="cle" class="pk-titre-ill"></span>
    <h2 class="pp-id-titre">Identifiez-vous</h2>
    <p style="opacity:0.6;margin:0">Ce passeport est réservé aux structures partenaires — identifiez-vous avec votre code habituel.</p>
    <div class="recherche-passeport">
      <label for="champ-code-structure" class="sr-only">Code structure</label>
      <input type="text" id="champ-code-structure" class="input" placeholder="Code structure" autocomplete="off" spellcheck="false">
      <button type="button" class="btn btn-primary" id="btn-identifier-structure">Continuer</button>
    </div>
    <div id="retour-identification"></div>
    <button type="button" class="lien-mode-admin" id="btn-mode-admin">Vous êtes de l'équipe CVDL ?</button>
    <div id="zone-mode-admin" hidden>
      <div class="recherche-passeport" style="margin-bottom:0">
        <label for="champ-mot-de-passe-admin" class="sr-only">Mot de passe admin</label>
        <input type="password" id="champ-mot-de-passe-admin" class="input" placeholder="Mot de passe admin" autocomplete="off">
        <button type="button" class="btn btn-primary" id="btn-identifier-admin">Continuer</button>
      </div>
    </div>
  </div>

  <div id="etape-recherche" hidden>
    <div class="recherche-passeport">
      <label for="champ-numero-serie" class="sr-only">Numéro de série</label>
      <input type="text" id="champ-numero-serie" class="input" placeholder="Numéro de série" autocomplete="off" spellcheck="false">
      <button type="button" class="btn btn-primary" id="btn-chercher-passeport">Voir le passeport</button>
    </div>
    <div id="zone-passeport"></div>
  </div>
</main>

<script src="pages/passeport.js?v=3"></script>
</body>
</html>
