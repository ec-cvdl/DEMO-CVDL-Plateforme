<script>
const API = (function(){ var prod = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api'; try{ var dossier = location.pathname.split('/')[1] || ''; if(/demo/i.test(dossier) && !/\.html$/i.test(dossier)) return prod + '-demo'; var d = JSON.parse(localStorage.getItem('cvdl-mode-demo') || 'null'); if(d && d.jusqua > Date.now()) return prod + '-demo'; }catch(e){} return prod; })(); // démo : site publié dans un dossier « …demo… » (ex. /cvdl-demo/), ou repère posé par demo.html → cvdl-api-demo

  <!-- Étape : identification par numéro de série -->

<script>
const $ = id => document.getElementById(id);

function echapper(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function afficherMsg(id, texte, type){
  $(id).innerHTML = texte ? `<div class="msg msg-${type}">${echapper(texte)}</div>` : '';
}
// Même calcul que côté admin (statutGarantiePourDate()/badgeGarantie() dans app.js) — dupliqué
// ici, pas de module JS partagé entre l'admin et les pages publiques dans ce projet.
function statutGarantiePublic(dateAchatFormatee){
  const [j, m, a] = String(dateAchatFormatee || '').split('/').map(function(n){ return parseInt(n, 10); });
  if(!j || !m || !a) return { statut: null };
  const dateMiGarantie = new Date(a + 1, m - 1, j);
  const dateFinGarantie = new Date(a + 2, m - 1, j);
  const maintenant = new Date();
  return { statut: maintenant >= dateFinGarantie ? 'expiree' : maintenant >= dateMiGarantie ? 'bientot' : 'en_cours' };
}
function badgeGarantiePublicSav(dateAchatFormatee){
  const statut = statutGarantiePublic(dateAchatFormatee).statut;
  const cfg = {
    en_cours: { bg: '#1F9D55', texte: 'Garantie en cours' },
    bientot: { bg: '#7A5A00', texte: 'Garantie bientôt expirée' },
    expiree: { bg: '#E5484D', texte: 'Hors garantie' },
  }[statut];
  if(!cfg) return '';
  return '<span style="display:inline-flex;align-items:center;gap:6px;background:' + cfg.bg + ';color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;flex:none;white-space:nowrap">' + cfg.texte + '</span>';
}

function jsonp(params){
  return fetch(API + '?' + new URLSearchParams(params)).then(r => r.json());
}

/* Mêmes teintes que le back-office, pour que la couleur du statut reste cohérente partout */
const TEINTES_SAV = {
  't-ambre':     { fond:'#FFF3CC', texte:'#7A5A00' },
  't-bleu':      { fond:'#E0F2F2', texte:'#00777A' },
  't-violet':    { fond:'#FBE3EC', texte:'#C2185B' },
  't-turquoise': { fond:'#E0F2F2', texte:'#00777A' },
  't-vert':      { fond:'#E3F4EA', texte:'#147A43' },
  't-rouge':     { fond:'#FBE4E4', texte:'#C62828' },
  't-gris':      { fond:'#EEF2F5', texte:'#5A6D7D' }
};
let statutsSavPublic = [];

function construireAnneauSav(statutActuel){
  if(!statutsSavPublic.length) return '';
  const statutCourant = statutsSavPublic.find(s => s.statut === statutActuel);
  if(!statutCourant) return '';
  const teinte = TEINTES_SAV[statutCourant.couleur] || TEINTES_SAV['t-gris'];
  const rayon = 64 / 2 - 5;
  const circonference = 2 * Math.PI * rayon;

  const parcours = statutsSavPublic.filter(s => !s.terminal || s.finCycle);
  const estSortieAlternative = statutCourant.terminal && !statutCourant.finCycle;

  let progression;
  let texteEtape = '';
  if(estSortieAlternative || statutCourant.finCycle){
    progression = 1;
    if(!estSortieAlternative) texteEtape = `${parcours.length}/${parcours.length}`;
  }else{
    const indexActuel = parcours.findIndex(s => s.statut === statutActuel);
    const total = parcours.length;
    progression = total ? (indexActuel + 1) / total : 0;
    if(indexActuel !== -1 && total) texteEtape = `${indexActuel + 1}/${total}`;
  }

  const decalage = circonference * (1 - progression);
  return `<svg class="anneau-sav-wrap" viewBox="0 0 64 64" width="64" height="64">
    <circle cx="32" cy="32" r="${rayon}" fill="none" stroke="var(--color-neutral-200)" stroke-width="6"/>
    <circle cx="32" cy="32" r="${rayon}" fill="none" stroke="${teinte.texte}" stroke-width="6"
      stroke-dasharray="${circonference.toFixed(1)}" stroke-dashoffset="${decalage.toFixed(1)}"
      stroke-linecap="round" transform="rotate(-90 32 32)"/>
    ${texteEtape ? `<text x="32" y="32" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" font-family="inherit" fill="${teinte.texte}">${texteEtape}</text>` : ''}
  </svg>`;
}

const tiroirsSavOuverts = new Set();
const SVG_SAV_V1 = {
  check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  attente:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
  cle:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>',
  chevron:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  qr:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-4"/></svg>',
  personne:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-2px"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  photo:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>',
  colis:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tiroir-sav]');
  if(!b) return;
  const carte = b.closest('.carte-ticket-suivi');
  const ouvert = !carte.classList.contains('ouvert');
  carte.classList.toggle('ouvert', ouvert);
  b.setAttribute('aria-expanded', ouvert);
  if(ouvert) tiroirsSavOuverts.add(b.dataset.tiroirSav); else tiroirsSavOuverts.delete(b.dataset.tiroirSav);
});
// Arrivée depuis le portail avec ?ref= : tiroir de la demande visée ouvert d'office.
{ const refUrl = new URLSearchParams(location.search).get('ref'); if(refUrl) tiroirsSavOuverts.add(refUrl); }

function rendreTicketsSuivi(tickets){
  if(!tickets.length){
    $('liste-tickets-suivi').innerHTML = `<div class="pk-etat pk-vide"><span data-ill="vide"></span>Aucune demande SAV trouvée pour ce numéro de série.</div>`;
    return;
  }
  $('liste-tickets-suivi').innerHTML = tickets.map((t, i) => {
    const statutCourantTicket = statutsSavPublic.find(s => s.statut === t.statut);
    const teinte = TEINTES_SAV[statutCourantTicket ? statutCourantTicket.couleur : 't-gris'] || TEINTES_SAV['t-gris'];
    const liensColissimo = (statutCourantTicket && (statutCourantTicket.colissimo || statutCourantTicket.terminal))
      ? String(t.colissimo || '').split('\n').map(s => s.trim()).filter(Boolean) : [];
    const historique = t.historique || [];
    // ── Carte « colonne d'état + tiroir » (même composant que Mes commandes) ──
    const ordre = statutsSavPublic.map(s => s.statut);
    const indexEtape = Math.max(0, ordre.indexOf(t.statut));
    const terminal = !!(statutCourantTicket && statutCourantTicket.terminal);
    const couleur = statutCourantTicket ? statutCourantTicket.couleur : '';
    const famille = terminal ? (couleur === 't-rouge' ? 'ko' : 'ok') : couleur === 't-rouge' ? 'urg' : (couleur === 't-ambre' ? 'action' : 'cours');
    const nbBarres = Math.min(Math.max(ordre.length, 1), 6);
    const rempli = terminal ? nbBarres : Math.max(1, Math.round((indexEtape + 1) / Math.max(ordre.length, 1) * nbBarres));
    const barres = `<div class="v1-barres">${Array.from({ length: nbBarres }, (_, k) => `<i class="${k < rempli ? 'on' : ''}${k === rempli - 1 && !terminal ? ' now' : ''}"></i>`).join('')}</div>`;
    const icone = terminal ? SVG_SAV_V1.check : famille === 'action' ? SVG_SAV_V1.attente : SVG_SAV_V1.cle;
    const codeStructure = (() => { try{ const cs = sessionStorage.getItem('cvdl-code-structure'); return cs ? '&code=' + encodeURIComponent(cs) : ''; }catch(e){ return ''; } })();
    const ouvert = tiroirsSavOuverts.has(t.reference);
    const frise = historique.length
      ? `<ol class="v1-frise">${historique.map((hh, k) => `<li class="on${k === historique.length - 1 && !terminal ? ' now' : ''}"><i></i><span>${echapper(hh.statut)}</span><small>${echapper(hh.date)}</small></li>`).join('')}</ol>`
      : `<ol class="v1-frise"><li class="on"><i></i><span>Ouverte</span><small>${echapper(t.date || '')}</small></li><li class="on now"><i></i><span>${echapper(t.statut || '')}</span><small></small></li></ol>`;
    const docs = [
      t.photo ? `<a class="pk-lien" href="${echapper(urlSure(t.photo))}" target="_blank" rel="noopener">${SVG_SAV_V1.photo}Photo jointe</a>` : '',
      t.bonColissimo ? `<a class="pk-lien" href="${echapper(urlSure(t.bonColissimo))}" target="_blank" rel="noopener">${SVG_SAV_V1.colis}Bon Colissimo (PDF)</a>` : '',
      ...liensColissimo.map((l, k) => `<a class="pk-lien" href="${echapper(urlSure(l))}" target="_blank" rel="noopener">${SVG_SAV_V1.colis}${liensColissimo.length > 1 ? 'Colis ' + (k + 1) : 'Suivi Colissimo'}</a>`),
    ].filter(Boolean).join('');
    const formeTicket = terminal ? 'rond' : (famille === 'action' ? 'losange' : 'carre');
    const histoTicket = historique.length ? historique : [{ statut: 'Demande ouverte', date: t.date || '' }, { statut: t.statut || '', date: '' }];
    const docsTicket = [
      t.photo ? `<a class="cs-doc" href="${echapper(urlSure(t.photo))}" target="_blank" rel="noopener"><span data-ill="passeport" class="ill"></span>Photo jointe</a>` : '',
      t.bonColissimo ? `<a class="cs-doc cs-doc-bon" href="${echapper(urlSure(t.bonColissimo))}" target="_blank" rel="noopener"><span data-ill="attestations" class="ill"></span>Bon Colissimo à imprimer</a>` : '',
      ...liensColissimo.map((l, k) => `<a class="cs-doc" href="${echapper(urlSure(l))}" target="_blank" rel="noopener"><span data-ill="stock" class="ill"></span>${liensColissimo.length > 1 ? 'Colis ' + (k + 1) : 'Suivi Colissimo'}</a>`),
    ].filter(Boolean).join('');
    return `<article class="card carte-ticket-suivi ts-carte${terminal ? ' fini' : ''}${ouvert ? ' ouvert' : ''}" data-reference="${echapper(t.reference)}">
      <div class="ts-tete">
        <span class="ts-anneau">${construireAnneauSav(t.statut)}</span>
        <div class="ts-tete-txt">
          <div class="cvdl-surtitre">${echapper(t.reference)} · ${t.dateResolution ? 'résolu le ' + echapper(t.dateResolution) : 'ouvert le ' + echapper(t.date || '')}</div>
          <b class="ts-titre">${echapper(t.symptome || 'Symptôme non précisé')}</b>
          <div class="ts-pastilles"><span class="tag" data-forme="${formeTicket}" style="--forme:${teinte.texte}">${echapper(t.statut || '')}</span>${t.dateAchat ? badgeGarantiePublicSav(t.dateAchat) : ''}</div>
        </div>
      </div>
      ${(t.nomBeneficiaire || t.numeroSerie) ? `<div class="ts-meta">${t.nomBeneficiaire ? `<span class="ts-personne"><span data-ill="personne" class="ill"></span><b>${echapper(t.nomBeneficiaire)}</b></span>` : ''}${t.numeroSerie ? window.piluleSerieCvdl(t.numeroSerie, { query: codeStructure }) : ''}</div>` : ''}
      ${t.notesResolution ? `<div class="ts-message"><span class="pk-lab">Message de l’équipe</span>${echapper(t.notesResolution)}</div>` : ''}
      <div class="cs-pied">
        <div class="cs-docs">${docsTicket}</div>
        <div class="cs-actions"><button type="button" class="cs-details-btn" data-tiroir-sav="${echapper(t.reference)}" aria-expanded="${ouvert}">Historique (${histoTicket.length}) ${SVG_SAV_V1.chevron}</button>${t.numeroSerie ? `<a class="btn btn-secondary v1-btn" href="passeport.html?sn=${encodeURIComponent(t.numeroSerie)}${codeStructure}" data-passeport-url="passeport.html?sn=${encodeURIComponent(t.numeroSerie)}${codeStructure}" data-sn="${echapper(t.numeroSerie)}">Voir le passeport</a>` : ''}</div>
      </div>
      <div class="cs-details"><div><div class="cs-details-in">
        <ol class="pp-frise ts-frise">${histoTicket.map((hh, k) => `<li class="${k === histoTicket.length - 1 ? 'dernier' : ''}${k === histoTicket.length - 1 && terminal ? ' fini' : ''}"><i></i><span>${echapper(hh.statut)}</span><small>${echapper(hh.date || '')}</small></li>`).join('')}</ol>
      </div></div></div>
    </article>`;
  }).join('');
  // Fil d'échanges (sav-fil.js) : ouvert seulement avec la preuve (référence ou e-mail).
  if(window.CvdlFilSav) CvdlFilSav.brancher($('liste-tickets-suivi'), tickets, t => ({ reference: t.reference, numeroSerie: $('numero-serie').value.trim(), preuve: $('preuve-sav').value.trim() }));

}

async function chargerTicketsSuivi(){
  const numeroSerie = $('numero-serie').value.trim();
  if(!numeroSerie){ afficherMsg('retour-numero', 'Merci de saisir un numéro de série.', 'erreur'); return; }
  try{ sessionStorage.setItem('cvdl-numero-serie-suivi', numeroSerie); }catch(e){}

  $('btn-voir-tickets').disabled = true;
  $('btn-voir-tickets').innerHTML = '<span class="spinner-inline"></span>Recherche…';
  afficherMsg('retour-numero', '', 'info');

  try{
    const [r, rStatuts] = await Promise.all([
      jsonp({ action: 'sav-par-numero-serie', numeroSerie: numeroSerie, preuve: $('preuve-sav').value.trim() }),
      statutsSavPublic.length ? Promise.resolve({ ok: true, statuts: statutsSavPublic }) : jsonp({ action: 'sav-statuts-public' })
    ]);
    if(rStatuts.ok) statutsSavPublic = rStatuts.statuts.sort((a, b) => a.ordre - b.ordre);
    if(r.ok){
      $('nb-tickets-texte').textContent = r.tickets.length > 1
        ? `${r.tickets.length} demandes trouvées`
        : (r.tickets.length === 1 ? '1 demande trouvée' : '');
      rendreTicketsSuivi(r.tickets);
      $('etape-numero').hidden = true;
      $('etape-liste').hidden = false;
      demarrerRafraichissementAutoSuivi();
    }else{
      afficherMsg('retour-numero', r.erreur || 'Numéro introuvable.', 'erreur');
    }
  }catch(e){
    afficherMsg('retour-numero', 'Connexion impossible. Réessayez dans un instant.', 'erreur');
  }
  $('btn-voir-tickets').disabled = false;
  $('btn-voir-tickets').textContent = 'Continuer';
}

$('btn-voir-tickets').addEventListener('click', chargerTicketsSuivi);
$('numero-serie').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); chargerTicketsSuivi(); } });

try{
  const serieMemorisee = sessionStorage.getItem('cvdl-numero-serie-suivi');
  if(serieMemorisee) $('numero-serie').value = serieMemorisee;
}catch(e){}

$('btn-autre-numero').addEventListener('click', () => {
  $('numero-serie').value = '';
  $('retour-numero').innerHTML = '';
  $('etape-liste').hidden = true;
  $('etape-numero').hidden = false;
  $('numero-serie').focus();
});

let intervalleRafraichissementSuivi = null;

async function rafraichirSuiviSilencieusement(){
  if(document.hidden) return;
  if(window.CvdlFilSav && CvdlFilSav.enSaisie()) return; // ne pas effacer un message en cours
  const numeroSerie = $('numero-serie').value.trim();
  if(!numeroSerie) return;
  try{
    const r = await jsonp({ action: 'sav-par-numero-serie', numeroSerie: numeroSerie, preuve: $('preuve-sav').value.trim() });
    if(r.ok){
      rendreTicketsSuivi(r.tickets);
      $('nb-tickets-texte').textContent = r.tickets.length > 1
        ? `${r.tickets.length} demandes trouvées`
        : (r.tickets.length === 1 ? '1 demande trouvée' : '');
    }
  }catch(e){ /* on retente simplement au prochain cycle */ }
}
function demarrerRafraichissementAutoSuivi(){
  if(intervalleRafraichissementSuivi) return;
  intervalleRafraichissementSuivi = setInterval(rafraichirSuiviSilencieusement, 25000);
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && !$('etape-liste').hidden) rafraichirSuiviSilencieusement();
});
</script>
</body>
</html>
