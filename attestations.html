<!DOCTYPE html>
<html lang="fr">
<head>
<script>
const API = (function(){ var prod = 'https://europe-west1-cvdl-plateforme.cloudfunctions.net/cvdl-api'; try{ var dossier = location.pathname.split('/')[1] || ''; if(/demo/i.test(dossier) && !/\.html$/i.test(dossier)) return prod + '-demo'; var d = JSON.parse(localStorage.getItem('cvdl-mode-demo') || 'null'); if(d && d.jusqua > Date.now()) return prod + '-demo'; }catch(e){} return prod; })(); // démo : site publié dans un dossier « …demo… » (ex. /cvdl-demo/), ou repère posé par demo.html → cvdl-api-demo
</script>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attestations — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=32">
<style>
/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1040px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner .7s linear infinite; margin-right:8px; vertical-align:-2px; }
@keyframes tourner{ to{ transform:rotate(360deg); } }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#voile-verification-precoce .spinner-precoce{ width:34px; height:34px; animation:tourner .8s linear infinite; }
.liste-appareils-attestation{ display:flex; flex-direction:column; gap:8px; margin-top:var(--space-4); }
.carte-appareil-attestation{ display:flex; justify-content:space-between; align-items:center; padding:var(--space-4); cursor:pointer; }
.personne-attestation{ opacity:0.6; }
@media (max-width: 640px){
main{ padding:var(--space-6) var(--space-4); }
}
.carte-appareil-attestation{ padding:12px 16px !important; }
.carte-appareil-attestation .mono{ display:inline-flex; padding:3px 8px; }
</style>
<script src="portail-ui.js?v=24" defer></script>
<script src="cvdl-ui.js?v=11" defer></script>
<link rel="stylesheet" href="retours.css?v=1">
<script src="retours.js?v=1" defer></script>
</head>
<body data-famille="commandes">
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" onclick="location.href='portail-structure.html'">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <div id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Génération d'<em>attestations</em></h1>
      <p style="opacity:0.6;margin:0">Identifiez-vous avec votre code structure pour retrouver vos appareils.</p>
      <div class="field">
        <label for="id-code" class="sr-only">Code structure</label>
        <input type="text" class="input" id="id-code" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-id-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-verifier-code">Continuer</button>
    </div>
  </div>

  <div id="etape-liste" hidden>
    <span data-ill="attestations" class="pk-titre-ill xl"></span>
    <h1 style="margin-bottom:var(--space-2)">Choisissez un <em>appareil</em></h1>
    <p style="opacity:0.6;margin:0 0 var(--space-4)">Seuls les appareils déjà associés à une personne (numéro de série ↔ personne, depuis votre flotte) apparaissent ici.</p>
    <div class="field">
      <label for="recherche-appareil-attestation" class="sr-only">Rechercher</label>
      <input type="text" class="input" id="recherche-appareil-attestation" autocomplete="off" placeholder="Rechercher par numéro de série ou nom…">
    </div>
    <div id="retour-liste-appareils"></div>
    <div class="liste-appareils-attestation" id="liste-appareils-attestation"></div>
  </div>

  <div id="etape-generer" hidden style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <h1 style="margin:0">Générer l'<em>attestation</em></h1>
      <p style="opacity:0.6;margin:0" id="recap-appareil-attestation"></p>
      <div class="field">
        <label for="attestation-nom-input">Nom complet</label>
        <input type="text" class="input" id="attestation-nom-input" placeholder="Nom complet" autocomplete="name">
      </div>
      <div class="field">
        <label for="attestation-naissance-input">Date de naissance</label>
        <input type="date" class="input" id="attestation-naissance-input">
      </div>
      <div id="retour-attestation" aria-live="polite"></div>
      <button type="button" class="btn btn-primary" style="width:100%;justify-content:center" id="btn-generer-attestation">Générer l'attestation</button>
      <button type="button" class="btn-retour" style="justify-content:center" id="btn-retour-liste"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Choisir un autre appareil</button>
    </div>
  </div>

</main>

<script>
try{ if(sessionStorage.getItem('cvdl-code-structure')) document.documentElement.classList.add('deja-identifie'); }catch(e){}
</script>
<script>
const $ = id => document.getElementById(id);
function echapper(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function poster(data){
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(data) }).then(r => r.json());
}
function jsonp(params){
  return fetch(API + '?' + new URLSearchParams(params)).then(r => r.json());
}

let codeValide = '';
let appareilsAttestation = [];
let appareilChoisi = null;

async function verifierCode(){
  const code = $('id-code').value.trim();
  if(!code){ $('retour-id-code').innerHTML = '<div class="msg msg-erreur">Saisissez votre code structure.</div>'; return; }
  $('btn-verifier-code').disabled = true;
  $('btn-verifier-code').innerHTML = '<span class="spinner-inline"></span>Vérification…';
  $('retour-id-code').innerHTML = '';
  try{
    const r = await jsonp({action:'check', code});
    if(r.ok){
      codeValide = code;
      try{ sessionStorage.setItem('cvdl-code-structure', code); }catch(e){}
      $('etape-code').hidden = true;
      $('etape-liste').hidden = false;
      await chargerAppareilsAttestation();
    }else{
      $('retour-id-code').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Code invalide.')}</div>`;
    }
  }catch(e){
    $('retour-id-code').innerHTML = '<div class="msg msg-erreur">Connexion impossible. Réessayez.</div>';
  }
  $('btn-verifier-code').disabled = false;
  $('btn-verifier-code').textContent = 'Continuer';
}
$('btn-verifier-code').addEventListener('click', verifierCode);
$('id-code').addEventListener('keydown', e => { if(e.key === 'Enter') verifierCode(); });

async function chargerAppareilsAttestation(){
  $('retour-liste-appareils').innerHTML = '<div class="pk-etat pk-chargement"><span class="spinner-inline"></span>Chargement…</div>';
  try{
    const r = await jsonp({action:'flotte-lister', code: codeValide});
    if(!r.ok){ $('retour-liste-appareils').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Chargement impossible.')}</div>`; return; }
    appareilsAttestation = (r.appareils || []).filter(a => a.personne);
    $('retour-liste-appareils').innerHTML = '';
    rendreListeAppareilsAttestation();
  }catch(e){
    $('retour-liste-appareils').innerHTML = '<div class="msg msg-erreur">Chargement impossible — réessaie.</div>';
  }
}

function rendreListeAppareilsAttestation(){
  const terme = $('recherche-appareil-attestation').value.trim().toLowerCase();
  const visibles = terme
    ? appareilsAttestation.filter(a => (a.numeroSerie||'').toLowerCase().includes(terme) || (a.personne||'').toLowerCase().includes(terme))
    : appareilsAttestation;

  if(!visibles.length){
    $('liste-appareils-attestation').innerHTML = `<p style="opacity:0.6;font-size:14px">${appareilsAttestation.length ? 'Aucun appareil ne correspond à cette recherche.' : "Aucun appareil associé à une personne pour le moment — associez-les d'abord depuis votre gestion de flotte."}</p>`;
    return;
  }
  $('liste-appareils-attestation').innerHTML = visibles.map((a) => `
    <div class="carte-appareil-attestation at-ligne" data-appareil-index="${appareilsAttestation.indexOf(a)}" role="button" tabindex="0">
      <span class="at-ill">${(window.illustrationCvdl && window.cleIllustrationProduit) ? window.illustrationCvdl(window.cleIllustrationProduit(a.produit || ''), 36) : ''}</span>
      <span class="at-txt"><b>${echapper(a.produit || 'Appareil')}</b><span class="pk-sn">${echapper(a.numeroSerie)}</span></span>
      <span class="at-personne">${echapper(a.personne)}</span>
      <span class="at-go">Générer →</span>
    </div>`).join('');
}
$('recherche-appareil-attestation').addEventListener('input', rendreListeAppareilsAttestation);
$('liste-appareils-attestation').addEventListener('keydown', e => { const c = e.target.closest('[data-appareil-index]'); if(c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); c.click(); } });

$('liste-appareils-attestation').addEventListener('click', e => {
  const carte = e.target.closest('[data-appareil-index]');
  if(!carte) return;
  appareilChoisi = appareilsAttestation[parseInt(carte.dataset.appareilIndex, 10)];
  if(!appareilChoisi) return;
  $('etape-liste').hidden = true;
  $('etape-generer').hidden = false;
  $('recap-appareil-attestation').textContent = `${appareilChoisi.numeroSerie} — ${appareilChoisi.produit || ''}`;
  $('attestation-nom-input').value = appareilChoisi.personne || '';
  // La date de naissance est déjà connue dès qu'un∙e agent∙e l'a saisie lors de l'attribution
  // de l'appareil (flotte interne) — pas besoin de la redemander si elle existe déjà.
  $('attestation-naissance-input').value = appareilChoisi.dateNaissance ? appareilChoisi.dateNaissance.split('/').reverse().join('-') : '';
  $('retour-attestation').innerHTML = '';
});

$('btn-retour-liste').addEventListener('click', () => {
  $('etape-generer').hidden = true;
  $('etape-liste').hidden = false;
});

$('btn-generer-attestation').addEventListener('click', async () => {
  if(!appareilChoisi) return;
  const nomComplet = $('attestation-nom-input').value.trim();
  const dateNaissanceISO = $('attestation-naissance-input').value;
  if(!nomComplet){ $('retour-attestation').innerHTML = '<div class="msg msg-erreur">Le nom est obligatoire.</div>'; return; }
  const dateNaissance = dateNaissanceISO ? dateNaissanceISO.split('-').reverse().join('/') : '';

  $('btn-generer-attestation').disabled = true;
  $('retour-attestation').innerHTML = '<div class="msg msg-info">Génération en cours…</div>';
  try{
    const r = await poster({ action:'flotte-generer-attestation', code: codeValide, numeroSerie: appareilChoisi.numeroSerie, nomComplet, dateNaissance });
    if(r.ok){
      $('retour-attestation').innerHTML = `<div class="msg msg-succes">Prête — <a href="${echapper(urlSure(r.url))}" target="_blank" rel="noopener">l'ouvrir ↗</a></div>`;
    }else{
      $('retour-attestation').innerHTML = `<div class="msg msg-erreur">${echapper(r.erreur || 'Génération impossible.')}</div>`;
    }
  }catch(e){
    $('retour-attestation').innerHTML = '<div class="msg msg-erreur">Génération impossible — réessaie.</div>';
  }
  $('btn-generer-attestation').disabled = false;
});

try{
  const codeMemorise = sessionStorage.getItem('cvdl-code-structure');
  if(codeMemorise){
    $('id-code').value = codeMemorise;
    verifierCode().finally(() => {
      document.documentElement.classList.remove('deja-identifie');
      const v = $('voile-verification-precoce'); if(v) v.style.display = 'none';
    });
  }
}catch(e){}
</script>
</body>
</html>
