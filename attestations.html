<!DOCTYPE html>
<html lang="fr">
<head>
<script src="api.js?v=1"></script>
<script src="commun.js?v=1"></script>
<meta charset="utf-8">
<script src="anti-cadre.js?v=1"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net; frame-src 'self' https://ec-cvdl.github.io; object-src 'none'; base-uri 'none'; form-action 'self' https://europe-west1-cvdl-plateforme.cloudfunctions.net">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attestations — CVDL</title>
<link rel="stylesheet" href="cvdl-ui.css?v=34">
<style>
/* Mise en page uniquement — tout le visuel vient de cvdl-ui.css */
[hidden]{ display:none!important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; }
main{ max-width:1040px; margin:0 auto; padding:var(--space-8) var(--space-6) 64px; }
.spinner-inline{ display:inline-block; width:14px; height:14px; animation:tourner .7s linear infinite; margin-right:8px; vertical-align:-2px; }
@keyframes tourner{ to{ transform:rotate(360deg); } }
html.deja-identifie #etape-code{ display:none!important; }
html.deja-identifie #voile-verification-precoce{ display:flex; }
#voile-verification-precoce{ display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
#voile-verification-precoce .spinner-precoce{ width:34px; height:34px; animation:tourner .8s linear infinite; }
.liste-appareils-attestation{ display:flex; flex-direction:column; gap:8px; margin-top:var(--space-4); }
.carte-appareil-attestation{ display:flex; justify-content:space-between; align-items:center; padding:var(--space-4); cursor:pointer; }
.personne-attestation{ opacity:0.6; }
@media (max-width: 640px){
main{ padding:var(--space-6) var(--space-4); }
}
.carte-appareil-attestation{ padding:12px 16px !important; }
.carte-appareil-attestation .mono{ display:inline-flex; padding:3px 8px; }
</style>
<script src="portail-ui.js?v=30" defer></script>
<script src="cvdl-ui.js?v=12" defer></script>
<link rel="stylesheet" href="retours.css?v=2">
<script src="retours.js?v=2" defer></script>
</head>
<body data-famille="commandes">
<div id="voile-verification-precoce"><div class="spinner-precoce"></div></div>

<main id="contenu-principal">
  <img src="logo.png" alt="Emmaüs Connect" class="logo-portail">
  <button type="button" class="btn-retour-portail" style="margin-bottom:var(--space-4)" data-aller="portail-structure.html">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Portail
  </button>

  <div id="etape-code" style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <span data-ill="cle" class="pk-titre-ill"></span>
      <h1 style="margin:0">Génération d'<em>attestations</em></h1>
      <p style="opacity:0.6;margin:0">Identifiez-vous avec votre code structure pour retrouver vos appareils.</p>
      <div class="field">
        <label for="id-code" class="sr-only">Code structure</label>
        <input type="text" class="input" id="id-code" autocomplete="off" spellcheck="false" placeholder="Votre code structure">
      </div>
      <div id="retour-id-code" aria-live="polite"></div>
      <button type="button" class="btn btn-primary btn-block" id="btn-verifier-code">Continuer</button>
    </div>
  </div>

  <div id="etape-liste" hidden>
    <span data-ill="attestations" class="pk-titre-ill xl"></span>
    <h1 style="margin-bottom:var(--space-2)">Choisissez un <em>appareil</em></h1>
    <p style="opacity:0.6;margin:0 0 var(--space-4)">Seuls les appareils déjà associés à une personne (numéro de série ↔ personne, depuis votre flotte) apparaissent ici.</p>
    <div class="field">
      <label for="recherche-appareil-attestation" class="sr-only">Rechercher</label>
      <input type="text" class="input" id="recherche-appareil-attestation" autocomplete="off" placeholder="Rechercher par numéro de série ou nom…">
    </div>
    <div id="retour-liste-appareils"></div>
    <div class="liste-appareils-attestation" id="liste-appareils-attestation"></div>
  </div>

  <div id="etape-generer" hidden style="max-width:460px;margin:0 auto">
    <div class="card elev-lg" style="padding:var(--space-8) var(--space-6);gap:var(--space-4)">
      <h1 style="margin:0">Générer l'<em>attestation</em></h1>
      <p style="opacity:0.6;margin:0" id="recap-appareil-attestation"></p>
      <div class="field">
        <label for="attestation-nom-input">Nom complet</label>
        <input type="text" class="input" id="attestation-nom-input" placeholder="Nom complet" autocomplete="name">
      </div>
      <div class="field">
        <label for="attestation-naissance-input">Date de naissance</label>
        <input type="date" class="input" id="attestation-naissance-input">
      </div>
      <div id="retour-attestation" aria-live="polite"></div>
      <button type="button" class="btn btn-primary" style="width:100%;justify-content:center" id="btn-generer-attestation">Générer l'attestation</button>
      <button type="button" class="btn-retour" style="justify-content:center" id="btn-retour-liste"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>Choisir un autre appareil</button>
    </div>
  </div>

</main>

<script src="deja-identifie.js?v=1"></script>
<script src="pages/attestations.js?v=3"></script>
</body>
</html>
