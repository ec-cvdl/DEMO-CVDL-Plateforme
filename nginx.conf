# Serveur web du site (Cloud Run, voir Dockerfile et DEPLOIEMENT.md). Fichier inclus dans le bloc
# http de nginx.

# Cache : pages et journal relus à chaque visite ; scripts et styles un jour (le ?v=N des pages
# change à chaque modification) ; images une semaine.
map $uri $cvdl_cache {
  default                          "no-cache";
  ~*\.(js|css)$                    "public, max-age=86400";
  ~*\.(png|jpe?g|svg|ico|webp|gif)$ "public, max-age=604800";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  charset_types text/css application/javascript text/markdown;
  server_tokens off;

  add_header Cache-Control $cvdl_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;

  # Fichiers cachés (.git, .env…) : jamais servis.
  location ~ /\. {
    return 404;
  }
  # Journal des mises à jour, lu par projet.html.
  location ~* \.md$ {
    default_type text/markdown;
  }
  location / {
    try_files $uri $uri/ =404;
  }
}
